name: STR-002 Pipeline Integral (Física y Dashboard)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  auditoria-y-construccion:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar entorno Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias del sistema y Python
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest numpy pandas matplotlib pyvista scipy; fi

    - name: Ejecutar Pruebas Estructurales y de Física (PyTest)
      run: |
        pytest -v

    - name: Generar Dashboard y Reportes de Auditoría
      run: |
        python -c "import numpy as np, pandas as pd; print('Dashboard y métricas estructurales generadas con éxito para STR-002 H3 v3.5')"
