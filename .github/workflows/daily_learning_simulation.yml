name: Daily Multi-Parcel Learning Simulation

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-multi-parcel-simulation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas plotly

      - name: Execute Dual Parcel Simulation & QGC Plan Generation
        run: |
          python mission/daily_cron_simulation.py

      - name: Generate Interactive Dashboard
        run: |
          python mission/generate_dashboard.py

      - name: Commit and Push Updated Historical Log & Plans
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add simulation/historical_learning_log.csv mission/generated_plans/ docs/
          git diff-index --quiet HEAD || git commit -m '🤖 GitHub Actions: Simulacion geomatica multi-API y dashboard Plotly actualizados [skip ci]'
          git push
