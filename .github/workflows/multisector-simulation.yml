name: Simulación Multisectorial y Gemelo Digital

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ejecutar-simulacion-multisectorial:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias científicas y geodésicas
        run: pip install numpy pandas shapely pyproj matplotlib

      - name: Ejecutar script de simulación y telemetría
        run: python simulate_and_sync.py

      - name: Sincronizar gemelo digital con GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/panel_vuelo/
          git commit -m "bot(multisectorial): actualización automática de telemetría y panel de vuelo [skip ci]" || echo "Sin cambios"
          git push
