name: Simulación Multisectorial y Gemelo Digital
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
jobs:
  run-multisector-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias científicas
        run: pip install numpy matplotlib
      - name: Ejecutar simulación multisectorial con APIs en vivo
        run: python simulador_gemelo_digital_total.py
      - name: Sincronizar gemelo digital
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetria_campo/
          git commit -m "bot(multisectorial): actualiza gemelo digital con clima, suelo y gráficos" || echo "Sin cambios"
          git push
