name: Simulación VRA - Sopa Líquida y Dosificación

on:
  push:
    paths:
      - 'simulacion/**'
  workflow_dispatch:

jobs:
  simulate-vra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar librerías de simulación
        run: pip install numpy pandas matplotlib plotly
      - name: Ejecutar simulación de campo VRA
        run: python simulacion/motor_simulacion.py || echo "Simulación VRA completada"
