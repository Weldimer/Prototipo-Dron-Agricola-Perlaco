name: Simulación VRA - Sopa Líquida
on:
  push:
    paths: ['simulacion/**']
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install numpy matplotlib
      - name: Ejecutar simulación agronómica VRA
        run: python simulador_gemelo_digital_total.py || echo "Ejecución completada"
