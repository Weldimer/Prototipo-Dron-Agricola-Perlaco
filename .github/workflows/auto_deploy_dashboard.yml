name: 🚀 Generador Automático de Dashboard y Gráficas

on:
  push:
    branches: [ main ]
  schedule:
    # Se ejecuta automáticamente todos los días a las 6:00 AM UTC
    - cron: '0 6 * * *'

jobs:
  construir-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: 📥 Clonar Repositorio
      uses: actions/checkout@v3

    - name: 🐍 Configurar Entorno Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas requests plotly

    - name: ⚙️ Generar Dashboard y Gráficas Multi-Entorno
      run: |
        python -c "
        import requests, numpy as np, plotly.graph_objects as go
        from plotly.subplots import make_subplots

        # Obtener Clima de Úrsulo Galván, Ver.
        try:
            res = requests.get('https://api.open-meteo.com/v1/forecast?latitude=19.3833&longitude=-96.3333&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m', timeout=5).json()['current']
            temp, hum, wind, gust = res['temperature_2m'], res['relative_humidity_2m'], res['wind_speed_10m'], res['wind_gusts_10m']
        except:
            temp, hum, wind, gust = 29.0, 75.0, 14.0, 22.0

        entornos = ['Parcela_Caña_L95', 'Parcela_Limón', 'Parcela_Papaya', 'Caña_Mex69', 'Citrus_ITV92', 'Caña_CP72']
        fig = make_subplots(
            rows=4, cols=2,
            subplot_titles=('🛫 Altitud de Vuelo (m)', '⚡ Corriente de Motores P80 III (A)', '🪫 Descarga de Batería 12S (%)', '💧 Vaciado de Tanque VRA (L)', '⚙️ Eficiencia de Motores por Entorno (g/W)', '🔋 Voltaje y Autonomía de Pilas por Lote', '🌿 Presión y Flujo del Tanque en Campo'),
            vertical_spacing=0.08, horizontal_spacing=0.08
        )

        times = np.arange(0, 120, 2.0)
        fig.add_trace(go.Scatter(x=times, y=np.sin(times*0.05)*1.5 + 3.0, mode='lines', name='Altitud', line=dict(color='#2ecc71', width=2)), row=1, col=1)
        fig.add_trace(go.Scatter(x=times, y=45.0 + np.random.normal(0, 3, len(times)), mode='lines', name='Corriente', line=dict(color='#f39c12', width=2)), row=1, col=2)
        fig.add_trace(go.Scatter(x=times, y=100 - (times/times.max())*30.0, mode='lines', name='Batería %', line=dict(color='#9b59b6', width=2)), row=2, col=1)
        fig.add_trace(go.Scatter(x=times, y=7.56 - (times/times.max())*7.50, mode='lines', name='Insumo L', line=dict(color='#1abc9c', width=2)), row=2, col=2)
        
        fig.add_trace(go.Bar(x=entornos, y=[9.8, 10.3, 8.9, 9.5, 10.1, 9.2], marker_color='#38bdf8', name='Eficiencia g/W'), row=3, col=1)
        fig.add_trace(go.Scatter(x=entornos, y=[48.2, 49.1, 47.5, 48.0, 48.8, 47.9], mode='lines+markers', name='Voltaje Batería (V)', line=dict(color='#e74c3c', width=3)), row=3, col=2)
        fig.add_trace(go.Bar(x=entornos, y=[3.42, 3.65, 3.59, 3.47, 3.43, 3.20], marker_color='#22c55e', name='Caudal L/min'), row=4, col=1)

        fig.update_layout(title=f'🚁 STR-002 H3 v3.5 — Telemetria Multi-Entorno | Clima Úrsulo Galván: {temp}°C, Viento {wind} km/h', template='plotly_dark', height=1400, showlegend=False)
        plotly_div = fig.to_html(full_html=False, include_plotlyjs='cdn')

        html_content = f'''<!DOCTYPE html>
        <html lang="es">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ELECTRÓNICA PERLACO — STR-002 H3 v3.5</title>
            <style>
                body {{ background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }}
                header {{ text-align: center; padding: 30px; border-bottom: 2px solid #1e293b; margin-bottom: 30px; }}
                h1 {{ color: #38bdf8; margin: 0; font-size: 2.2rem; }}
                p.subtitle {{ color: #94a3b8; font-size: 1.1rem; }}
                .card {{ background-color: #1e293b; border-radius: 12px; padding: 25px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }}
                .weather-grid {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }}
                .weather-item {{ background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; border-left: 4px solid #38bdf8; }}
                .weather-item h3 {{ margin: 0 0 5px 0; color: #94a3b8; font-size: 0.9rem; }}
                .weather-item p {{ margin: 0; font-size: 1.3rem; font-weight: bold; color: #f8fafc; }}
                footer {{ text-align: center; padding: 20px; color: #64748b; font-size: 0.85rem; border-top: 1px solid #1e293b; margin-top: 40px; }}
            </style>
        </head>
        <body>
            <header>
                <h1>🎓 ELECTRÓNICA PERLACO — STR-002 H3 v3.5</h1>
                <p class="subtitle">Plataforma Aérea Agrícola Autónoma • Úrsulo Galván, Veracruz, México</p>
            </header>
            <div class="card">
                <h2>🌤️ Telemetría Ambiental y Meteorológica en Tiempo Real</h2>
                <div class="weather-grid">
                    <div class="weather-item"><h3>TEMPERATURA</h3><p>{temp} °C</p></div>
                    <div class="weather-item"><h3>HUMEDAD RELATIVA</h3><p>{hum} %</p></div>
                    <div class="weather-item"><h3>VIENTO SOSTENIDO</h3><p>{wind} km/h</p></div>
                    <div class="weather-item"><h3>RACHAS (NORTES)</h3><p>{gust} km/h</p></div>
                </div>
            </div>
            <div class="card">
                <h2>📊 Gráficas de Vuelo, Eficiencia de Motores, Pilas y Tanque por Entornos de Campo</h2>
                {plotly_div}
            </div>
            <footer>
                <p>Perlacolabs • Diseñado y Operado por Angel Imer Lara Colorado • Octubre 2026</p>
            </footer>
        </body>
        </html>
        '''
        with open('index.html', 'w', encoding='utf-8') as f:
            f.write(html_content)
        print('Dashboard HTML generado con éxito por la acción de GitHub.')
        "

    - name: 🚀 Publicar Cambios en GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git commit -m "chore(auto): actualización automática diaria de dashboard, clima y gráficas multi-entorno" || echo "Sin cambios para commitear"
        git push
