name: Mechanical FEA Audit

on:
  push:
    branches: [ main ]

jobs:
  audit-structure:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Run Structural Audit Script
      run: |
        python3 src/estructura.py
