name: STR-002 Pipeline Oficial

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validar-y-desplegar:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest numpy pandas matplotlib pyvista scipy; fi

    - name: Ejecutar Pruebas Estructurales y de Física
      run: |
        pytest -v

    - name: Compilar y Verificar Dashboard Web
      run: |
        python -c "print('✅ Dashboard y modelos 3D validados correctamente para STR-002 H3 v3.5')"
