name: 🧪 CI - Pruebas de Física y Estructura

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-fisica:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Clonar Repositorio
      uses: actions/checkout@v3

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Instalar Dependencias y PyTest
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy pandas requests plotly

    - name: 🚀 Ejecutar Suite de Pruebas Unitarias
      run: |
        pytest -v
