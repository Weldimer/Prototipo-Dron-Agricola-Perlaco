name: 🧪 CI - Pruebas de Física y Estructura

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-fisi-estruct:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: 📦 Instalar Dependencias y PyTest
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy pandas requests plotly pymavlink

    - name: Run pytest
      env:
        PYTHONPATH: ${{ github.workspace }}/edge_ai/src:${{ github.workspace }}/edge_ai/tests
      run: |
        pytest -v
