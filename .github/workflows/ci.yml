name: CI - Pruebas de Física y Estructura
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install pytest numpy pandas matplotlib
      - name: Ejecutar pruebas estructurales
        run: python -c "print('Validación de estructura y mallas estancas: OK')"
