name: CI - Pruebas de Física y Estructura

on:
  push:
    branches: [ main, master, feature/limpieza-workflows-str002 ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Instalar dependencias estables
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest numpy pandas matplotlib pyvista scipy; fi
        
    - name: Ejecutar Pruebas Estructurales con PyTest
      run: |
        pytest -v
