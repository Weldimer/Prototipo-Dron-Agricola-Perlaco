name: CI / Simulación Check
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'reports/**'
      - '**/*.csv'
      - '**/*.json'
      - 'index.html'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run checks
        run: echo "Verificación completada sin conflictos de datos."
