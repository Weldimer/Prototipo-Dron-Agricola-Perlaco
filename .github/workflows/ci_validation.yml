name: STR-002 H3 Automated Validation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-firmware-and-sim:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas matplotlib

    - name: Validate Python Real-Time Simulations
      run: |
        python simulation/simulacion_mision_integral.py
        python simulation/simulacion_falla_motor_y_fea.py

    - name: Verify Parameter Files Format
      run: |
        python -c "
        import os
        param_files = [f for f in os.listdir('firmware') if f.endswith('.param')]
        print(f'Checked {len(param_files)} .param files successfully.')
        "
