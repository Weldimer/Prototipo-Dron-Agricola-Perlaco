name: STR-002 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pytest pymavlink numpy pandas cryptography

    - name: Ejecutar Pruebas Unitarias (Pytest)
      run: |
        pytest edge_ai/tests/ -v

    - name: Validación Estática de Sintaxis Python y Lua
      run: |
        python -m py_compile edge_ai/src/core_scheduler.py
        python -m py_compile edge_ai/src/secure_bridge.py
        echo "✅ Compilación estática exitosa."
