name: Bot de Telemetría y Auditoría Autónoma
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
jobs:
  run-telemetry-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install numpy matplotlib
      - name: Ejecutar script dinámico
        run: python simulador_gemelo_digital_total.py
      - name: Auto-actualizar reportes y gráficas en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetria_campo/
          git commit -m "bot(telemetria): actualiza gráficas y reportes de campo en tiempo real" || echo "Sin cambios"
          git push
